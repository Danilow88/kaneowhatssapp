name: Kaneo keepalive (Render free tier)

# O plano free do Render derruba o serviço após 15min sem tráfego.
# Este ping evita isso batendo no health check a cada 10min.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Kaneo health endpoint
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" https://kaneo-whatsapp-bridge.onrender.com/api/health
